[workspace]
members = ["moku-bin", "moku-config", "moku-core", "moku-crypto", "moku-daemon", "moku-lua", "moku-notify", "moku-pomodoro-daemon", "moku-store", "moku-sys", "moku-vault", "moku-volume-daemon", "moku-volume-fs", "moku-volume-mount", "xtask", "modules/*"]

resolver = "2"

[workspace.dependencies]
# TUI & Terminal
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

# Async & Core
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
arc-swap = "1"

# CLI & Data
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
toml = "0.9"
toml_edit = "0.25"
serde_path_to_error = "0.1"
dotenvy = "0.15"

# Web & Network
reqwest = { version = "0.13", features = ["json", "rustls"] }
feed-rs = "2"

# Logging & Error Handling
color-eyre = "0.6"
tracing = "0.1"
tracing-error = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# System & File
directories = "6.0"
sysinfo = "0.38"
auto-launch = "0.5"
notify-rust = "4.11"

colored = "3"
ignore = "0.4"
arboard = "3"
rpassword = "7"

tempfile = "3"

# Storage
sled = "0.34"

# Cryptography
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
secrecy = { version = "0.10", features = ["serde"] }
aes-gcm = "0.10"
# Only moku-crypto may depend on the crates below (and on argon2/aes-gcm
# above); moku-crypto/tests/crypto_crate_ban.rs enforces it.
aes-siv = "0.7"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
# Listed directly only to switch on their `zeroize` feature: features don't
# propagate from aes-gcm, so without these the AES round keys and GHASH
# state are dropped unwiped (see moku-crypto/tests/zeroize_on_free.rs).
aes = "0.8"
ghash = "0.5"
polyval = "0.6"
chacha20 = "0.9"
poly1305 = "0.8"
base64 = "0.22"

# Mnemonic: not used yet. Kept for the recovery-key work in P5, where the
# BIP39 crate choice (tiny-bip39 vs bip39) is decided (audit KN-5.5).
tiny-bip39 = "2.0"


rand = "0.8"
regex = "1.10"

mlua = { version = "0.11", features = ["lua54", "vendored", "send"] }

# Bildirim ikon üretimi (sadece xtask kullanır, runtime'a girmez)
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

# Windows AUMID kaydı (sadece moku-notify, sadece Windows hedefinde) +
# FreeConsole (moku-bin, autostart'ta konsol penceresini gizlemek için)
winreg = "0.52"
# Single `windows` version for the whole workspace (0.62, the one winfsp
# and sysinfo already pull in). Crates add the features they need locally.
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Console"] }

# Internal Crates
moku-core = { path = "./moku-core" }
moku-sys = { path = "./moku-sys" }
moku-config = { path = "./moku-config" }
moku-crypto = { path = "./moku-crypto" }
moku-vault = { path = "./moku-vault" }
moku-store = { path = "./moku-store" }
moku-pomodoro-daemon = { path = "./moku-pomodoro-daemon" }
