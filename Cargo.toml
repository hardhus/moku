[workspace]
members = ["moku-bin", "moku-core", "modules/*"]

resolver = "2"

[workspace.dependencies]
# TUI & Terminal
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

# Async & Core
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
arc-swap = "1"

# CLI & Data
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
toml = "0.9"
dotenvy = "0.15"

# Web & Network
reqwest = { version = "0.13", features = ["json", "rustls"] }

# Logging & Error Handling
color-eyre = "0.6"
tracing = "0.1"
tracing-error = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# System & File
directories = "6.0"
sysinfo = "0.38"

colored = "3"
ignore = "0.4"
arboard = "3"

tempfile = "3"

# Storage
sled = "0.34"

# Cryptography
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
secrecy = { version = "0.10", features = ["serde"] }
aes-gcm = "0.10"

# Mnemonic
tiny-bip39 = "2.0"


rand = "0.8"
regex = "1.10"

# Internal Crates
moku-core = { path = "./moku-core" }
