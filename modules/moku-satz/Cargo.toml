[package]
name = "moku-satz"
version = "0.1.0"
edition = "2024"

[dependencies]
moku-core.workspace = true
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
serde.workspace = true
ratatui.workspace = true
crossterm.workspace = true

# satz-core is the user's own Markdown-vault library (github.com/hardhus/satz,
# a workspace with satz-core/satz-cli/satz-lsp members) — pulled as a git
# dependency by package name (no `path=`, per explicit instruction), tracking
# main since it's the same author's actively-developed project.
satz-core = { git = "https://github.com/hardhus/satz" }

# Only for formatting today's daily-note filename/frontmatter date — same
# version satz's own workspace already pins, kept scoped here rather than
# promoted to workspace.dependencies since nothing else needs it.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile.workspace = true
arc-swap.workspace = true
tokio.workspace = true
toml.workspace = true
