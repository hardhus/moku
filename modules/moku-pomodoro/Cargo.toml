[package]
name = "moku-pomodoro"
version = "0.1.0"
edition = "2024"

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
moku-config.workspace = true
moku-core.workspace = true
moku-pomodoro-daemon.workspace = true
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
serde.workspace = true
tokio.workspace = true
toml.workspace = true

ratatui = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }

[dev-dependencies]
moku-vault.workspace = true
moku-store.workspace = true
tempfile.workspace = true
arc-swap.workspace = true
