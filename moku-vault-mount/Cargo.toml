[package]
name = "moku-vault-mount"
version = "0.1.0"
edition = "2024"

[dependencies]
moku-vault-fs = { path = "../moku-vault-fs" }
anyhow.workspace = true

# WinFsp shim — only compiled (and only depended on) when targeting
# Windows. The FUSE/Unix shim lands in a later pass (see plan §2/§3); this
# crate is Windows-first because that's what's actually installable and
# testable in this environment (WinFsp SDK confirmed present).
[target.'cfg(windows)'.dependencies]
winfsp = { version = "0.13", features = ["system", "windows-62"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(windows)'.build-dependencies]
winfsp = { version = "0.13", features = ["delayload"] }

[build-dependencies]

# FUSE shim — developed and cross-compile-checked from this (Windows) dev
# environment but not runtime-tested here; there is no FUSE/Linux machine
# available this session (plan Faz 6). Verify with:
#   cargo check --target x86_64-unknown-linux-gnu -p moku-vault-mount
[target.'cfg(unix)'.dependencies]
fuser = "0.18"
libc = "0.2"

[dev-dependencies]
moku-core.workspace = true
tokio.workspace = true
tempfile.workspace = true
zeroize.workspace = true
