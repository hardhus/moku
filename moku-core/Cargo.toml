[package]
name = "moku-core"
version = "0.1.1"
edition = "2024"

[dependencies]
moku-sys.workspace = true
ratatui.workspace = true
crossterm.workspace = true
anyhow.workspace = true
async-trait.workspace = true
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
arc-swap.workspace = true
futures.workspace = true

sled.workspace = true
zeroize.workspace = true
argon2.workspace = true
aes-gcm.workspace = true
rand.workspace = true
secrecy.workspace = true

# security::cli: interactive, no-echo vault password prompts shared by CLI commands.
rpassword.workspace = true

# Per-module storage subkey derivation (storage/keys.rs) — same
# scoped-not-workspace pinning as moku-volume-fs/moku-volume-daemon's own
# HKDF usage.
hkdf = "0.12"
sha2 = "0.10"

[dev-dependencies]
tempfile.workspace = true

