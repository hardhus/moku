[package]
name = "moku-vault"
version = "0.1.0"
edition = "2024"

# The app vault: meta.json (salt + canary) on disk, initialize/unlock,
# the in-memory unlocked session, and the shared CLI password prompts.
# Builds on moku-crypto's pure primitives; this is the layer that does
# file IO and runs the KDF on a blocking thread.

[dependencies]
moku-crypto.workspace = true
moku-sys.workspace = true
thiserror.workspace = true
arc-swap.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
zeroize.workspace = true

# cli: interactive, no-echo vault password prompts shared by CLI commands.
rpassword.workspace = true

[dev-dependencies]
tempfile.workspace = true
