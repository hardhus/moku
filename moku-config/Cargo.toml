[package]
name = "moku-config"
version = "0.1.0"
edition = "2024"

# config.toml: the schema (general/keys/storage/themes/modules/plugins),
# `ConfigHandle` (the one owner of the file: lock-free reads, atomic
# comment-preserving writes, read-only/write-locked fallbacks for a broken
# file or section), and the per-module encryption policy resolved from it.
# No UI dependency — moku-core turns `ThemeColors` into ratatui colors.

[dependencies]
moku-sys.workspace = true
arc-swap.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
# Comment- and order-preserving edits of config.toml.
toml_edit.workspace = true
# Reports which field of a config table failed to parse.
serde_path_to_error.workspace = true

[dev-dependencies]
tempfile.workspace = true
