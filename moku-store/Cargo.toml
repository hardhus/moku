[package]
name = "moku-store"
version = "0.1.0"
edition = "2024"

# Module data storage: the per-module sled databases, the storage envelope
# (encrypted/plaintext, key scheme, external blobs) and the key-scheme
# migration chain. Encrypts with moku-crypto under per-module subkeys of
# the key held by moku-vault's session. No UI dependency.

[dependencies]
moku-crypto.workspace = true
moku-sys.workspace = true
moku-vault.workspace = true
anyhow.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sled.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
zeroize.workspace = true
# fixture_v0_2_7.rs checks the frozen fixtures against their SHA256SUMS.
sha2 = "0.10"
