[package]
name = "moku-crypto"
version = "0.1.0"
edition = "2024"

# Pure cryptographic primitives: key types, the password KDF, AEAD and
# HKDF subkey derivation. No file IO and no tokio, by design (P2 decision
# KN-2.3) — anything that reads/writes key material on disk or needs an
# async runtime lives in moku-vault, which builds on this crate.
#
# This is the only crate allowed to depend on the RustCrypto primitives
# (aes-gcm, aes-siv, chacha20poly1305, hkdf, argon2, ...); see
# tests/crypto_crate_ban.rs.

[dependencies]
thiserror.workspace = true
zeroize.workspace = true
secrecy.workspace = true
rand.workspace = true
argon2 = { workspace = true, features = ["zeroize"] }
aes-gcm = { workspace = true, features = ["zeroize"] }
aes-siv.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
sha2.workspace = true
aes = { workspace = true, features = ["zeroize"] }
ghash = { workspace = true, features = ["zeroize"] }
polyval = { workspace = true, features = ["zeroize"] }
chacha20 = { workspace = true, features = ["zeroize"] }
poly1305 = { workspace = true, features = ["zeroize"] }

[dev-dependencies]
base64.workspace = true
