[package]
name = "moku-vault-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
moku-core.workspace = true
moku-vault-fs = { path = "../moku-vault-fs" }
moku-vault-mount = { path = "../moku-vault-mount" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
sysinfo.workspace = true
ratatui.workspace = true
crossterm.workspace = true
async-trait.workspace = true
secrecy.workspace = true
zeroize.workspace = true

# Derives a per-volume master key from moku's app-vault master key
# (Default password mode) — same crates, same scoped-not-workspace
# rationale as moku-vault-fs's own HKDF usage.
hkdf = "0.12"
sha2 = "0.10"

[dev-dependencies]
tempfile.workspace = true
arc-swap.workspace = true
