[package]
name = "moku-volume-mount"
version = "0.1.0"
edition = "2024"

[dependencies]
moku-volume-fs = { path = "../moku-volume-fs" }
thiserror.workspace = true

# WinFsp shim — only compiled (and only depended on) when targeting
# Windows. The FUSE/Unix shim (fuser, below) is implemented and
# cross-compile-checked but not runtime-tested; this crate is Windows-first
# because that's what's actually installable and testable here.
[target.'cfg(windows)'.dependencies]
winfsp = { version = "0.13", features = ["system", "windows-62"] }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }

[target.'cfg(windows)'.build-dependencies]
winfsp = { version = "0.13", features = ["delayload"] }

[build-dependencies]

# FUSE shim — developed and cross-compile-checked from this (Windows) dev
# environment but not runtime-tested here; there is no FUSE/Linux machine
# available this session (plan Faz 6). Verify with:
#   cargo check --target x86_64-unknown-linux-gnu -p moku-volume-mount
[target.'cfg(unix)'.dependencies]
fuser = "0.18"
libc = "0.2"

[dev-dependencies]
moku-vault.workspace = true
tokio.workspace = true
tempfile.workspace = true
moku-crypto.workspace = true
